[project]
name = "Companion"
version = "0.1.0"
description = "Real-camera marker following and model-program control for Tello"
requires-python = ">=3.11,<3.12"
dependencies = [
  "djitellopy==2.5.0",
  "numpy==1.26.4",
  "opencv-python==4.8.0.76",
  "websockets>=15,<17",
  "av>=12,<17",
  "pynput>=1.7,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "sounddevice>=0.5,<0.6"]

[tool.pytest.ini_options]
pythonpath = [".", "tests", "modules/ai", "modules/follow"]
testpaths = ["tests", "modules/ai", "modules/follow/tests"]
python_files = ["test*.py", "*Tests.py"]
