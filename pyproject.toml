[project]
name = "Companion"
version = "0.1.0"
description = "Real-camera marker following and structured-action control for Tello"
requires-python = ">=3.11,<3.12"
dependencies = [
  "djitellopy==2.5.0",
  "numpy==1.26.4",
  "opencv-python==4.8.0.76",
  "websockets>=15,<17",
  "av>=12,<17",
  "pynput>=1.7,<2",
  "volcengine-ark-runtime",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = [".", "tests/helpers", "diagnostics/cloud", "diagnostics/hardware", "diagnostics/follow"]
testpaths = ["tests"]
python_files = ["test*.py", "*Tests.py"]
